<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Grande Carte au Trésor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>La Grande Carte au Trésor de Julos et LénaCat</h1>
    <div id="timer">01:30</div>
  </header>

  <section class="top">
    <div>
      <div class="label">MANCHE <span id="round-number">1</span>/5 — INDICE <span id="clue-number">1</span>/3</div>
      <div id="clue">Cette ville est l'ancienne capitale du Poitou.</div>
      <div id="clue-timer-bar"><div id="clue-timer-fill"></div></div>
      <div id="attempt-info"></div>
    </div>
    <button id="try" disabled>📍GUESS (1/2)</button>
  </section>

  <div id="map"></div>

  <section id="result" class="hidden">
    <div id="result-content"></div>
    <button id="next-round" class="hidden">▶ Manche suivante</button>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
